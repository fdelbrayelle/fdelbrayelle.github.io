          <p style="font-style: italic; margin-top: 25px;">Service center (Lille) - Partial remote</p>
          <p style="font-weight: bold;">Multiple web applications</p>
          <p><strong>Context:</strong>
            <ul>
              <li>Functional: Banking</li>
              <li>Business:
                <ul>
                  <li>New version of the intranet supplier acquisition platform web application (PAF) (entirely new monolithic application + several 100% back-end applications for calling suppliers via different protocols)</li>
                  <li>New screens and operational maintenance (MCO) on the "Know Your Customer" (KYC) intranet web application (measuring sensitivity of financing files, process automation, risk study decision rendering...)</li>
                  <li>New intranet web application for compliance with the <a href="https://eur-lex.europa.eu/legal-content/FR/TXT/?uri=CELEX:32016R0679" title="General Data Protection Regulation" target="_blank" rel="noreferrer noopener">General Data Protection Regulation</a> (GDPR) (entered into force on May 25, 2018, tight deadlines) in the context of managing personal data access or removal requests</li>
                </ul>
              </li>
              <li>Methodology: Agile (Scrum - 2 to 3-week sprints)</li>
              <li>Team: +/- 10 people</li>
            </ul>
          </p>
          <p><strong>Achievements:</strong>
            <ul>
              <li><strong>Architecture and technical leadership</strong>:
                <ul>
                  <li>Contributions to technical architecture documents (DAT)</li>
                  <li>Production of a document with proposals in the context of a continuous improvement audit: setting up CI/CD pipelines, memory leak prevention, migration to Java 11, migration from AngularJS to Angular, load testing setup (JMeter), ...</li>
                  <li>Design with <em>design first</em> approach (Swagger)</li>
                  <li>Technical analysis</li>
                  <li>Participation in architecture meetings and proposals on various topics of the pilot project (PAF v2) at the client's site (DevOps, Liquibase, ELK, OWASP...)</li>
                  <li>Participation in setting up application maintenance (TMA) during the tender process</li>
                </ul>
              </li>
              <li><em>Software craftsmanship</em>: code review, <em>Test-Driven Development</em> (<mark>TDD</mark>), <mark>pair-programming</mark>, CI/CD, mocks, ...</li>
              <li>Continuous improvement of development quality (Sonar tracking)</li>
              <li>Studies, development and testing: implementation of new features and bug fixes across multiple lots</li>
              <li>Impact study and implementation of JHipster to generate applications on Angular 7 and Spring Boot 2 after technical presentations to the client to validate this choice. Support to the client for launching a JHipster blueprint with parts specific to their IS (Web SSO SAML V2 authentication, log management, Oracle database, visual charter and theme)</li>
            </ul>
          </p>
          <p><strong>Tech stack:</strong> <mark>Java 8</mark>, <mark>Java 11</mark>, <mark>JHipster</mark>, <mark>Angular</mark>, <mark>AngularJS</mark>, <mark>Spring Boot</mark>, <mark>Spring MVC</mark>, <mark>Spring Data JPA</mark>, <mark>Spring Batch</mark>, <mark>Spring JMS</mark>, <mark>ActiveMQ</mark>, <mark>TIBCO JMS</mark>, <mark>Hibernate</mark>, <mark>Hibernate Envers</mark>, <mark>Netflix Zuul</mark>, <mark>Oracle</mark>, <mark>Liquibase</mark>, <mark>IBM WebSphere Liberty Profile</mark>, <mark>UML</mark>, <mark>Merise</mark>, <mark>git</mark>, <mark>Jenkins</mark></p>

