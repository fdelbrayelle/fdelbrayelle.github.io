          <p style="font-style: italic; margin-top: 25px;">Fully remote</p>
          <p style="font-weight: bold;">Multi-channel services / APIs (e-commerce, mobile...)</p>
          <p><strong>Context:</strong>
            <ul>
              <li>Functional: Sales / E-Commerce</li>
              <li>Business: PIM and checkout funnel. Redesign of the <a title="Galeries Lafayette" href="https://www.galerieslafayette.com/" target="_blank" rel="noreferrer noopener">Galeries Lafayette e-commerce website</a> (B2C) as part of the NewGL accelerator program to decommission the <em>legacy</em> system and unify product sheets with STEP as the central PIM tool. Services and APIs for the GL IS (e-commerce, in-store seller portal, checkout, mobile app).</li>
              <li>Methodology: Agile (Scrum - 2-week sprints - SAFe with monthly PI planning)</li>
              <li>Team: +/- 10 people</li>
              <li>Scale: Hundreds of thousands of products indexed each day - <a href="https://www.groupegalerieslafayette.fr/groupe" title="Galeries Lafayette Group" target="_blank" rel="noreferrer noopener">60 million visitors across 290 stores and e-commerce sites each year</a></li>
            </ul>
          </p>
          <p><strong>Achievements:</strong>
            <ul>
              <li><strong>Architecture and technical leadership</strong>:
                <ul>
                  <li>Cross-functional <em>tech lead</em> on <em>Product Information Management</em> (PIM) and the checkout funnel</li>
                  <li>Creation and modification of micro-services with a <em>design first</em> approach (OpenAPI) and hexagonal architecture for implementation</li>
                  <li>Design of UML diagrams: components (scope mapping), use cases and sequence diagrams</li>
                  <li>Maintaining advanced knowledge sharing (capitalization/documentation/impacts on Confluence)</li>
                  <li>Writing <a href="https://adr.github.io/" title="architectural decision records" target="_blank" rel="noreferrer noopener">ADR</a> (<em>architectural decision records</em>) to track discussions</li>
                  <li>Running technical workshops and dev sync meetings with the team and other stakeholders (ops, ...)</li>
                  <li>Synchronization points with <em>tech leads</em> from other teams</li>
                  <li>Revitalizing the NewGL developer community</li>
                  <li>Support as technical contact with various teams and stakeholders: front, BFF, seller portal app, checkout app, <em>legacy</em> apps and ops</li>
                  <li>Close collaboration with PO and SM</li>
                  <li>Architecture workshops and writing of RICEFW (<em>Reports, Interface, Conversion, Enhancements, Forms, and Workflows</em>), IFS (<em>InterFace Specifications</em>) and NFR (<em>Non Functional Requirements</em>) to support the implementation of SAP Commerce Cloud (<em>replatforming</em>)</li>
                  <li><em>On-boarding</em> of new team members (specific documentation, mentoring, <em>pair/mob-programming</em>...)</li>
                </ul>
              </li>
              <li><em>Software craftsmanship</em>: code review, <em>Test-Driven Development</em> (<mark>TDD</mark>), <em>Behavior-Driven Development</em> (<mark>BDD</mark>), <mark>pair-programming</mark> (with developers, <em>cloud engineers</em>), <mark>mob-programming</mark>, CI/CD, mocks, ...</li>
              <li>Continuous improvement of development quality (Sonar tracking)</li>
              <li>Studies, development and testing: implementation of new features and bug fixes on APIs and domain components (Offer, Merch, Product, Asset, Cart, Delivery, Payment, Customer, ...)</li>
              <li>100% <em>back-end</em> role across about twenty microservices (RESTful APIs) but with occasional need to understand BFF code (Apollo Server GraphQL), front-end code (in Vue 3 and GraphQL) or Jenkins library code (in Groovy)</li>
              <li><em>Scrum master</em> role to facilitate the team in Scrum rituals (<em>daily</em>, retrospectives, ...)</li>
              <li>Promotion of agile and DevOps practices within the team and across teams</li>
              <li>Use of Kafka as a <em>backbone</em> for communication between different components</li>
              <li>Use of Webhooks for Slack Incoming Webhooks and price/stock updates for marketplace offers from Mirakl</li>
              <li>Use of e-commerce tools: <a href="https://www.mirakl.fr/" title="Mirakl" target="_blank" rel="noreferrer noopener">Mirakl</a> (marketplace), <a href="https://www.stibosystems.com/fr/solution/step-mdm-platform" title="STEP" target="_blank" rel="noreferrer noopener">STEP</a> (PIM) (<em>Master Data Management</em>), <a href="https://attraqt.gitbook.io/developer-documentation/collect-online-users-activities/tracking-plans/fhr-complete" title="Fredhopper (FHR)" target="_blank" rel="noreferrer noopener">Fredhopper</a> (catalog pages and facets), <a href="https://www.grand-shooting.com/fr/" title="Grand Shooting" target="_blank" rel="noreferrer noopener">Grand Shooting</a> (<em>asset</em> management), <a href="https://www.target2sell.com/produits/recommend/" title="Target2Sell" target="_blank" rel="noreferrer noopener">Target2Sell</a> (recommendation engine), <a href="https://www.attraqt.com/fr-fr/blog/attraqt-acquiert-eb/" title="Early Birds" target="_blank" rel="noreferrer noopener">Early Birds</a>, <a href="https://www.sap.com/france/acquired-brands/what-is-hybris.html" title="Hybris" target="_blank" rel="noreferrer noopener">Hybris</a> (<em>legacy</em>), <a href="https://www.cloudflare.com/fr-fr/" title="Cloudflare" target="_blank" rel="noreferrer noopener">Cloudflare</a>, <a href="https://www.twicpics.com/fr" title="TwicPics" target="_blank" rel="noreferrer noopener">TwicPics</a>, <a href="https://www.algolia.com/" title="Algolia" target="_blank" rel="noreferrer noopener">Algolia</a> (<em>Site Search</em>), <a href="https://www.ingenico.com/fr/login/ogone/" title="Ogone" target="_blank" rel="noreferrer noopener">Ogone</a> (card PSP), <a href="https://www.odigo.com/" title="Prosodie" target="_blank" rel="noreferrer noopener">Prosodie</a> (gift card PSP), <a href="https://www.braintreepayments.com/" title="Braintree" target="_blank" rel="noreferrer noopener">Braintree</a> (PayPal PSP)...</li>
              <li>100% <em>full remote</em> organization (Slack, Mural, Google Meet, <a href="https://plugins.jetbrains.com/plugin/14896-code-with-me" title="IntelliJ Code With Me plugin" target="_blank" rel="noreferrer noopener">IntelliJ Code With Me</a>, ...) throughout the engagement</li>
            </ul>
          </p>
          <p><strong>Tech stack:</strong> <mark>Java 12 and 17</mark>, <mark>Kotlin</mark>, <mark>Python</mark>, <mark>Groovy</mark>, <mark>Micro-services</mark>, <mark>Hexagonal architecture</mark>, <mark>Spring Boot</mark>, <mark>Cucumber</mark>, <mark>Open API</mark>, <mark>PlantUML</mark>, <mark>Kafka</mark>, <mark>Kafka Streams</mark>, <mark>Kafka Connect</mark>, <mark>Aiven</mark>, <mark>Kubernetes</mark>, <mark>Docker</mark>, <mark>Arrow</mark>, <mark>MockK</mark>, <mark>vavr</mark>, <mark>Google Cloud Platform (Kubernetes Engine, Cloud SQL, Memorystore, Cloud Storage, Cloud Functions, BigQuery, ...)</mark>, <mark>Testcontainers</mark>, <mark>Cerberus</mark>, <mark>Karate</mark>, <mark>PostgreSQL</mark>, <mark>Redis</mark>, <mark>GraphQL</mark>, <mark>Webhooks</mark>, <mark>Keycloak</mark>, <mark>git</mark>, <mark>Bitbucket</mark>, <mark>Jenkins</mark>, <mark>ArgoCD</mark>, <mark>Terraform</mark>, <mark>Dynatrace</mark>, <mark>Elasticsearch Logstash Kibana</mark>, <mark>Grafana</mark></p>
          <hr style="margin: 25px 0; clear: left;" />

