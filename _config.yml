              <li>Team: +/- 10 people</li>
              <li>Scale: 700,000+ freelancers - 350,000+ enterprise clients - 200,000+ searches / month</li>
            </ul>
          </p>
          <p><strong>Achievements:</strong>
            <ul>
              <li>Following the Comatch acquisition, <a href="https://www.malt.fr/c/maltstrategy/companies?source_component=hero-strategy" title="Malt Strategy" target="_blank">new project funnel dedicated to a strategic category of freelancers</a></li>
              <li>Redesign of project / brief start date and duration management</li>
              <li>Technical migration of the freelancer search domain from JSP/HBS/JS (legacy) to Vue 3 / Nuxt 3</li>
              <li>Technical migration of the Vue 2 (legacy) project list to Vue 3 / Nuxt 3</li>
              <li>Redesign of the <a href="https://help.malt.com/kb/guide/fr/les-offres-et-frais-de-service-malt-HSSbMl3qrl/Steps/2689803" title="Malt service offers and fees" target="_blank">new service level system</a> and implementation of a blocking system to prevent <em>by-pass</em> (profile view counter for logged-in users, requirement to create an account and log in to view a profile, removal of information that could be used to find a freelancer outside the site...)</li>
              <li>Design of an <a href="https://www.malt.fr/c/product-release" title="AI Search" target="_blank">advanced search partly based on generative AI</a></li>
              <li><em>Proof of concept</em> built during an AI hackathon to find freelancers whose portfolio contains images matching a text or image search (<em>text to image</em>, <em>image to image</em>) using Vertex AI and QDrant (vector database)</li>
            </ul>
          </p>
          <p><strong>Architecture and technical leadership</strong>:
              <ul>
                <li>Maintaining advanced knowledge sharing (capitalization/documentation/impacts on Notion)</li>
                <li>Writing <a href="https://adr.github.io/" title="architectural decision records" target="_blank" rel="noreferrer noopener">ADR</a> (<em>architectural decision records</em>) to track discussions</li>
                <li>Running technical workshops and dev sync meetings with the team and other stakeholders (ops, ...)</li>
                <li>Synchronization points with <em>tech leads</em> from other squads</li>
                <li>Inter-squad synchronization points</li>
                <li>Close collaboration with Product Manager and Product Designer</li>
                <li><em>On-boarding</em> of new team members (specific documentation, mentoring, <em>pair/mob-programming</em>...)</li>
                <li>Organization of <em>event stormings</em> to define domain boundaries</li>
              </ul>
          </p>
          <p>
            <strong><em>Software craftsmanship</em></strong>: code review, <em>Test-Driven Development</em> (<mark>TDD</mark>), <mark>pair-programming</mark> (with developers, <em>platform engineers</em>), <mark>mob-programming</mark>, CI/CD, ...
          </p>
          <p>
