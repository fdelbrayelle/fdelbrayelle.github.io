          <p style="font-style: italic; margin-top: 25px;">On-site (Lezennes) - Partial and full remote</p>
          <p style="font-weight: bold;">Web application for tracking client construction projects</p>
          <p><strong>Context:</strong>
            <ul>
              <li>Functional: Sales</li>
              <li>Business: International deployment (notably to Portugal and Brazil) of the installation intranet application (<a href="https://instala.leroymerlin.fr" title="Instala" target="_blank" rel="noreferrer noopener">Instala</a>) linked to the client construction project hub in a highly competitive sector (retail/e-commerce and DIY) with convergence of French (LMFR) and Portuguese (LMPT) applications</li>
              <li>Methodology: Agile (Scrum - Kanban - <em>No Estimates</em> - <em>3 Amigos</em> - <em>Squads</em>), product-oriented team per the <a href="https://www.thiga.co/fr/livre-organisations-produit" title="Product-oriented organizations" target="_blank" rel="noreferrer noopener">Thiga framework</a> (OKR...)</li>
              <li>Team: +/- 25 people</li>
              <li>Scale: Hundreds of construction projects each week - Thousands of users (in-store advisors and craftsmen)</li>
            </ul>
          </p>
          <p><strong>Achievements:</strong>
            <ul>
              <li><strong>Architecture and technical leadership</strong>:
                <ul>
                  <li><em>Lead dev</em> on one of the product team squads in collaboration with the <em>tech lead</em></li>
                  <li>Creation and modification of micro-services</li>
