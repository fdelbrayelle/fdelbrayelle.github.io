          <p style="font-style: italic; margin-top: 25px;">On-site (Croix)</p>
          <p style="font-weight: bold;">Web application for the 3 Suisses e-commerce site (checkout funnel)</p>
          <p><strong>Context:</strong>
            <ul>
              <li>Functional: Sales / E-Commerce</li>
              <li>Business: Redesign of the checkout funnel for the <a title="3 Suisses" href="https://3suisses.fr" target="_blank" rel="noreferrer noopener">3 Suisses e-commerce site</a> (B2C) in a highly competitive sector</li>
              <li>Methodology: Agile (Scrum / Kanban)</li>
              <li>Team: +/- 10 people</li>
            </ul>
          </p>
          <p><strong>Achievements:</strong>
            <ul>
              <li>Studies, development and testing of <em>user stories</em> and anomalies on each step of the funnel (cart, benefits, delivery, payment, summary)</li>
              <li>Implementation of multi-channel RESTful web APIs (web and mobile)</li>
              <li>Implementation of a <em>fail-over switch</em> for degraded access mode to certain services such as payment</li>
              <li>Implementation of a predicate-based rules engine</li>
              <li>Practice of <em>Domain-Driven Design</em> (<mark>DDD</mark>) for design (ubiquitous language, bounded contexts, layered architecture...)</li>
              <li>Deployment of features on the ESB</li>
              <li>Reverse engineering (analysis and extraction of business rules from the mail and telephone order management application on initialization lot 0)</li>
              <li><em>Software craftsmanship</em>: code review, <em>Test-Driven Development</em> (<mark>TDD</mark>), <em>Behavior-Driven Development</em> (<mark>BDD</mark>), <mark>pair-programming</mark>, integration tests, CI/CD, mocks, <em>pomodoro</em>, anticipating technical debt, ...</li>
              <li>Continuous improvement of development quality (Sonar tracking)</li>
            </ul>
          </p>
          <p><strong>Tech stack:</strong> <mark>Java (EE)</mark>, <mark>Spring MVC</mark>, <mark>REST</mark>, <mark>SOAP</mark>, <mark>JDBC Template</mark>, <mark>Google Guava</mark>, <mark>Thymeleaf</mark>, <mark>UML</mark>, <mark>TDD</mark>, <mark>BDD</mark>, <mark>DDD</mark>, <mark>Tomcat</mark>, <mark>Weblogic</mark>, <mark>git</mark>, <mark>Jenkins</mark></p>

