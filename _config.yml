          <p style="font-style: italic; margin-top: 25px;">Service center (Ennevelin)</p>
          <p style="font-weight: bold;">Web application for pricing of medico-social institutions</p>
          <p><strong>Context:</strong>
            <ul>
              <li>Functional: Healthcare (public sector)</li>
              <li>Business: Extranet web application <a title="HArmonisation and Information Sharing" href="http://hapi.cnsa.fr" target="_blank" rel="noreferrer noopener">HAPI</a> for regional health agencies (ARS) to harmonize pricing processes (capacity and budget allocations to medico-social institutions) under the <a title="Law on hospital reform and relating to patients, health and territories" href="https://en.wikipedia.org/wiki/Hospital,_patients,_health,_territories" target="_blank" rel="noreferrer noopener">HPST</a> law</li>
              <li>Methodology: V-cycle</li>
              <li>Team: +/- 5 people</li>
            </ul>
          </p>
          <p><strong>Achievements:</strong>
            <ul>
              <li>Studies, development and testing within the TMA (third-party application maintenance): enhancements and anomaly corrections</li>
              <li>Technical impact studies</li>
              <li>Integration/delivery of new developments</li>
              <li>Creation of T-SQL (SQL Server) procedures for various data operations</li>
              <li>Operation of various environments (UAT, qualification)</li>
              <li>Technical workshops with the client</li>
              <li>Trip to Paris at the Norsys Paris agency MOA team for 2 months: numerous workshops for technical enhancements and impact studies, technical link between the Parisian MOE team and the Lille MOE team (development)</li>
              <li><em>Software craftsmanship</em>: code review, <em>Test-Driven Development</em> (<mark>TDD</mark>), <mark>pair-programming</mark>, CI, mocks, ...</li>
              <li>Continuous improvement of development quality (Sonar tracking)</li>
            </ul>
          </p>
          <p><strong>Tech stack:</strong><mark>Java (EE)</mark>, <mark>Spring MVC</mark>, <mark>Hibernate</mark>, <mark>GNU/Linux</mark>, <mark>SQL Server</mark>, <mark>UML</mark>, <mark>svn</mark>, <mark>Jenkins</mark></p>

          <hr style="margin: 25px 0; clear: left;" />
          <h4>3 Suisses - May 2012 to November 2012 (6 months)</h4>
