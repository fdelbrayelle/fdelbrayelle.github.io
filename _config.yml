    content:
      - layout: left
        title: SUPINFO
        sub_title: MSc Computer Science
        caption: 2008 - 2011
        # quote: >
        #   Short institution or course description (optional)
        description: | # this will include new lines to allow paragraphs
          Graduated with a Master of Science in Computer Science (<strong>equivalent to a 5-year Master's degree in Computer Science</strong>) from the École Supérieure d'Informatique in Lille. Wrote a dissertation linked to the final internship on the topic: "How can a developer improve software quality within a service centre?"

          Obtained the <strong>"Mandriva Certified Administrator" certification</strong> and was a <strong>member of the Java Lab</strong> from 2008 to 2010 (individual and group projects, topic presentations).

          <strong>71 weeks of internships</strong> in total (in partnership, work-study format, during the year and end-of-year internships):
            - In 2009 (2 days per week from January to June then 15 weeks at year end) at Compario (Lille - Euratechnologies) now <a title="Sparkow" href="http://sparkow.com/fr" target="_blank" rel="noreferrer noopener">Sparkow</a>, a software company offering a merchandising solution: development in <mark>.NET</mark> (<mark>C#</mark> and <mark>WPF</mark>) on a client site exporting French products to Japan, site optimisation, SEO, use of <mark>SQL Server</mark> and JavaScript (TreeMap, <mark>JQuery</mark>); creation of a reporting tool, anticipating user experience; implementation of RIA for product catalogues; <mark>Windows Server</mark> environment.
            - In 2010 (2 days per week from March to June then 13 weeks at year end) at Odimat (Liévin), a web SEO agency: technical leading and development of new modules (web SEO, customer relationship management, finance, invoicing, web page optimisation, positioning...) in <mark>Python</mark> for OpenERP now <a title="Odoo (formerly OpenERP)" href="https://www.odoo.com/fr_FR" target="_blank" rel="noreferrer noopener">Odoo</a>, use of <mark>PostgreSQL</mark> and learning key concepts related to natural SEO; daily use and administration of <mark>GNU/Linux</mark> (system administration); practice of <mark>extreme programming</mark>.
            - In 2011 (6 months end-of-studies) at <a title="Norsys" href="https://www.norsys.fr" target="_blank" rel="noreferrer noopener">Norsys</a> (Ennevelin): see above (experience); development of an <mark>Android</mark> internal communication app for the company.

