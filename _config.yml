          <p style="font-style: italic; margin-top: 25px;">Service center (Lille)</p>
          <p style="font-weight: bold;">Web application for operational risk management</p>
          <p><strong>Context:</strong>
            <ul>
              <li>Functional: Banking / Finance</li>
              <li>Business: Operational maintenance (MCO) and enhancements on the operational risk management intranet web application (project "CAROline") and other finance-sensitive projects</li>
              <li>Methodology: V-cycle</li>
              <li>Team: +/- 10 people</li>
            </ul>
          </p>
          <p><strong>Achievements:</strong>
            <ul>
              <li><strong>Architecture and technical leadership</strong>:
                <ul>
                  <li>Contributions to technical architecture documents (DAT)</li>
                  <li>Design workshops with the team and meetings with the client</li>
                  <li>Technical analyses with impact studies</li>
                  <li>Sharing of best practices</li>
                  <li>Writing of detailed technical specifications (DTS) (spanning multiple Java EE applications for subsidiaries and regional branch web apps)</li>
                  <li>Integration and onboarding of new developers (training and knowledge transfer)</li>
                </ul>
              </li>
              <li><em>Software craftsmanship</em>: code review, <em>Test-Driven Development</em> (<mark>TDD</mark>), <mark>pair-programming</mark>, CI, mocks, ...</li>
              <li>Continuous improvement of development quality (Sonar tracking)</li>
              <li>Taking on the application owner role and developer backup</li>
              <li>Studies, development and testing: implementation of new features and bug fixes across multiple lots</li>
              <li>Object model design</li>
              <li>Estimations, templates and quotes for future enhancements</li>
              <li>Root cause analysis of production incidents</li>
              <li>Analyses and fixes following security and quality audits</li>
              <li>Demos to numerous stakeholders</li>
              <li>Taking over a project under TMA (third-party application maintenance)</li>
              <li>MOE/MOA support for writing detailed functional specifications (DFS)</li>
              <li>Retro-documentation</li>
              <li>Monitoring of MOA and business acceptance testing with anomaly correction</li>
              <li>Modification of BIRT reports</li>
            </ul>
          </p>
          <p><strong>Tech stack:</strong> <mark>Java (EE)</mark>, <mark>JSF 1.2</mark>, <mark>JSF 2.0</mark>, <mark>RichFaces</mark>, <mark>Tomahawk</mark>, <mark>SOAP</mark>, <mark>JDBC Template</mark>, <mark>JBoss</mark>, <mark>WebSphere</mark>, <mark>IBM WebSphere Liberty Profile</mark>, <mark>DB2</mark>, <mark>MQ</mark>, <mark>Jenkins</mark>, <mark>Sonar</mark>, <mark>UML</mark></p>

          <hr style="margin: 25px 0; clear: left;" />
