          <p style="font-style: italic; margin-top: 25px;">Fully remote</p>
          <p style="font-weight: bold;">Plugins &amp; Ecosystem Squad</p>
          <p><strong>Context:</strong>
            <ul>
              <li>Functional: Creating workflows for data engineers, platform engineers and software engineers</li>
              <li>Business: Agnostic, event-driven orchestrator for mission-critical workflows — verticals: AI, Data Engineering, Infrastructure</li>
              <li>Methodology: <a href="https://basecamp.com/shapeup" target="_blank" rel="noreferrer noopener">Shape-up</a>, 2-month cycles (minor versions of Kestra core), continuous plugin releases</li>
              <li>Squad of 3; close collaboration with Engineering, Product, Sales, Marketing/GTM, Customer Success, and Direction</li>
              <li>Scale: <a href="https://github.com/kestra-io/kestra" target="_blank" rel="noreferrer noopener">Kestra</a> ~30,000 GitHub stars; 40+ enterprise customers; millions of workflows executed / month</li>
            </ul>
          </p>
          <p><strong>Achievements:</strong></p>
          <p><em>Plugins</em>
            <ul>
              <li><strong>Plugin Hub Growth:</strong> Grew from 600 to <a href="https://kestra.io/plugins" target="_blank" rel="noreferrer noopener">1800+ plugins</a> in 14 months (+200%, doubled in 9 months) across <a href="https://github.com/orgs/kestra-io/repositories?q=plugin" target="_blank" rel="noreferrer noopener">200+ plugin repositories</a> (OSS &amp; EE); <a href="https://github.com/search?q=author%3Afdelbrayelle+org%3Akestra-io&amp;type=pullrequests" target="_blank" rel="noreferrer noopener">10,000+ GitHub contributions</a> across the Kestra org; structured squad ownership, priorities, discovery and delivery</li>
              <li><strong>Reliability at Scale:</strong> Improved most used plugins (FS, Debezium, JDBC, Scripts, AWS, GCP, Azure, Serdes, Git, EE Git, EE Kubernetes, Docker, Terraform, Slack, AMQP, MinIO, <a href="https://kestra.io/plugins/core" target="_blank" rel="noreferrer noopener">core plugins</a>…); reduced Kubernetes EE test suite from 2h15 to 15 min; re-enabled and added/fixed hundreds of tests across hundreds of plugins; introduced daily CI on kestra:develop</li>
              <li><strong>Developer Experience &amp; Release Velocity:</strong> Built <a href="https://github.com/kestra-io/plugins-devtools" target="_blank" rel="noreferrer noopener">plugins-devtools</a> to automate dev, testing, and releases; introduced continuous automated releases and automated versioning across 1800+ plugins; contributed to <a href="https://kestra.io/docs/plugin-developer-guide" target="_blank" rel="noreferrer noopener">plugin developer guide</a>; dogfooding Kestra for plugin automation (<a href="https://www.linkedin.com/posts/fdelbrayelle_kestra-opensource-dataengineering-activity-7447888978512498688-bfBr" target="_blank" rel="noreferrer noopener">LinkedIn post</a>, <a href="https://kestra.io/blogs/2026-04-27-how-kestra-ships-plugins" target="_blank" rel="noreferrer noopener">blog post</a>)</li>
              <li><strong>Architecture &amp; Platform:</strong> Designed Plugin Metadata &amp; Releases API (<a href="https://github.com/kestra-io/api.kestra.io" target="_blank" rel="noreferrer noopener">api.kestra.io</a>) &amp; Versioned Plugin Docs architecture; drove performance improvements; shipped <a href="https://github.com/kestra-io/plugin-git/pull/177" target="_blank" rel="noreferrer noopener">NamespaceSync</a> &amp; <a href="https://github.com/kestra-io/plugin-git/pull/180" target="_blank" rel="noreferrer noopener">TenantSync</a> for Git Sync (OSS &amp; EE); covered EE features: <a href="https://kestra.io/docs/enterprise/instance/versioned-plugins" target="_blank" rel="noreferrer noopener">versioned plugins</a>, <a href="https://kestra.io/docs/enterprise/governance/secrets-manager" target="_blank" rel="noreferrer noopener">secrets manager</a>, <a href="https://kestra.io/docs/enterprise/governance/logshipper" target="_blank" rel="noreferrer noopener">log shipper</a>, <a href="https://kestra.io/docs/task-runners" target="_blank" rel="noreferrer noopener">task runners</a>, <a href="https://kestra.io/docs/concepts/storage" target="_blank" rel="noreferrer noopener">storage</a>; contributions to Kestra core — OSS: <a href="https://github.com/kestra-io/kestra/pull/16795" target="_blank" rel="noreferrer noopener">Topology UI</a> (task runner YAML injection, remote components, modal slot), <a href="https://github.com/kestra-io/kestra/pull/16894" target="_blank" rel="noreferrer noopener">CSRF token stabilization</a>, <a href="https://github.com/kestra-io/kestra/pull/14174" target="_blank" rel="noreferrer noopener">AI Copilot (Speech-to-Text)</a>, <a href="https://github.com/kestra-io/kestra/pull/16104" target="_blank" rel="noreferrer noopener">AI Copilot (MCP docs &amp; blueprints)</a>, <a href="https://github.com/kestra-io/kestra/pull/14922" target="_blank" rel="noreferrer noopener">execution/trigger log purge</a>; EE: <a href="https://github.com/kestra-io/kestra-ee/pull/8085" target="_blank" rel="noreferrer noopener">Plugin Release Notes modal</a>, <a href="https://github.com/kestra-io/kestra-ee/pull/8463" target="_blank" rel="noreferrer noopener">EE Registry PRIMARY-priority versioning</a>, <a href="https://github.com/kestra-io/kestra-ee/pull/7927" target="_blank" rel="noreferrer noopener">AdditionalPlugin subtypes (versioned IDs)</a>, <a href="https://github.com/kestra-io/kestra-ee/pull/7857" target="_blank" rel="noreferrer noopener">AI Copilot EE providers</a>, <a href="https://github.com/kestra-io/kestra-ee/pull/7139" target="_blank" rel="noreferrer noopener">searchInternalBlueprints source option</a>, <a href="https://github.com/kestra-io/kestra-ee/pull/6956" target="_blank" rel="noreferrer noopener">purge log options</a></li>
              <li><strong>New Plugins:</strong> Created from scratch: <a href="https://github.com/kestra-io/plugin-mistral/pull/1" target="_blank" rel="noreferrer noopener">Mistral</a>, <a href="https://github.com/kestra-io/plugin-deepseek/pull/2" target="_blank" rel="noreferrer noopener">Deepseek</a>, <a href="https://github.com/kestra-io/plugin-beam/pull/5" target="_blank" rel="noreferrer noopener">Beam</a>, <a href="https://github.com/kestra-io/plugin-bluesky/pull/3" target="_blank" rel="noreferrer noopener">Bluesky</a>, <a href="https://kestra.io/blogs/control-vmware-with-kestra" target="_blank" rel="noreferrer noopener">VMware EE</a>, SAP EE, 1Password (private repos), <a href="https://github.com/kestra-io/plugin-ai" target="_blank" rel="noreferrer noopener">AI</a> (AIAgent observability — <a href="https://www.linkedin.com/feed/update/urn:li:share:7459842060225986560/" target="_blank" rel="noreferrer noopener">LinkedIn post</a>), and so much more</li>
            </ul>
          </p>
          <p><em>Ecosystem</em>
            <ul>
              <li><strong>Tooling:</strong> Full ownership of non-plugin integrations — <a href="https://github.com/kestra-io/github-actions" target="_blank" rel="noreferrer noopener">GitHub Actions</a>, <a href="https://github.com/kestra-io/kestractl" target="_blank" rel="noreferrer noopener">kestractl</a>, <a href="https://github.com/kestra-io/libs" target="_blank" rel="noreferrer noopener">libs for scripts</a>, <a href="https://github.com/kestra-io/plugins-devtools" target="_blank" rel="noreferrer noopener">plugins-devtools</a>, <a href="https://github.com/kestra-io/client-sdk" target="_blank" rel="noreferrer noopener">client SDK</a>, <a href="https://github.com/kestra-io/terraform-provider-kestra" target="_blank" rel="noreferrer noopener">Terraform provider</a>, <a href="https://github.com/kestra-io/vscode-kestra" target="_blank" rel="noreferrer noopener">VS Code extension</a>, <a href="https://github.com/kestra-io/agent-skills" target="_blank" rel="noreferrer noopener">Agent Skills</a></li>
            </ul>
          </p>
          <p><em>Scope &amp; Impact</em>
            <ul>
              <li><strong>AI Enablement:</strong> Led adoption of AI in engineering: led Content Engineering (skills &amp; agents) on <a href="https://github.com/kestra-io/engineering-ai-hub" target="_blank" rel="noreferrer noopener">Engineering AI Hub</a>, co-authored AI Coding Agent Guidelines, and introduced remote MCP integrations for docs, plugins &amp; blueprints (<a href="https://kestra.io/blogs/2026-04-30-kestra-mcp-plugins-blueprints" target="_blank" rel="noreferrer noopener">blog post</a>, <a href="https://kestra.io/blogs/kestra-mcp-docs" target="_blank" rel="noreferrer noopener">Kestra MCP: Live Documentation Access for AI Coding Agents</a>)</li>
              <li><strong>Product:</strong> Acted as technical product partner, aligning roadmap and priorities with Product; org-wide scope — main interface between plugin ecosystem and every team (Engineering, Sales, Customer Success, DevRel, Product); contributed to <a href="https://github.com/kestra-io/docs" target="_blank" rel="noreferrer noopener">docs</a>; <a href="https://github.com/search?q=assignee%3Afdelbrayelle+org%3Akestra-io&amp;type=issues" target="_blank" rel="noreferrer noopener">hundreds of issues handled</a> (Hacktoberfest, regular events, Pylon tickets)</li>
              <li><strong>Leadership:</strong> Structured team: priorities, dashboards, workload split, mentoring, onboarding docs; contributed to hiring 3 engineers (including 1 for the squad); built partnerships (Conapi GmbH, WeScale)</li>
              <li><strong>Evangelism:</strong> Conferences: DevLille 2025 &amp; <a href="https://devlille.fr/talk-page-136143e9-347b-4884-b21c-ef9cd6caab40/" target="_blank" rel="noreferrer noopener">DevLille 2026</a> (talk on Kestra, plugins &amp; AI agents), <a href="https://bigdataldn.com" target="_blank" rel="noreferrer noopener">Big Data London 2025</a>, <a href="https://fdelbrayelle.github.io/meetups/datadayslille2026/en/" target="_blank" rel="noreferrer noopener">Data Days Lille 2026</a>; Webinar: <a href="https://www.youtube.com/watch?v=FLwFfCUU5XI" target="_blank" rel="noreferrer noopener">Building and Maintaining Kestra's 1700+ Plugins</a>; DevRel: contributed to videos (Python/Go/JS SDK, Gemini/Ollama/OpenAI/Salesforce/VMware plugins), blog posts (<a href="https://kestra.io/blogs/control-vmware-with-kestra" target="_blank" rel="noreferrer noopener">VMware</a>, <a href="https://kestra.io/blogs/infra-automation" target="_blank" rel="noreferrer noopener">infrastructure plugins</a>, <a href="https://kestra.io/blogs/2026-04-30-kestra-mcp-plugins-blueprints" target="_blank" rel="noreferrer noopener">MCP for plugins &amp; blueprints</a>, <a href="https://kestra.io/blogs/2026-04-27-how-kestra-ships-plugins" target="_blank" rel="noreferrer noopener">how Kestra ships plugins</a>), LinkedIn posts</li>
            </ul>
          </p>
          <p><strong>Tech stack:</strong> <mark>Java 21+</mark>, <mark>Micronaut</mark>, <mark>Gradle</mark>, <mark>Vue 3</mark>, <mark>Nuxt 3</mark>, <mark>Kafka</mark>, <mark>ElasticSearch</mark>, <mark>Kubernetes</mark>, <mark>Docker</mark>, <mark>Google Cloud Platform</mark>, <mark>PostgreSQL</mark>, <mark>git</mark>, <mark>GitHub Actions</mark>, <mark>ArgoCD</mark>, <mark>Terraform</mark>, <mark>Elasticsearch Logstash Kibana</mark>, <mark>Grafana</mark></p>
