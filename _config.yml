          <p style="font-style: italic; margin-top: 25px;">Service center (Lille), insurance branch of Crédit agricole</p>
          <p style="font-weight: bold;">Web application for insurance</p>
          <p><strong>Context:</strong>
            <ul>
              <li>Functional: Insurance</li>
              <li>Business: Implement new screens for an insurance management intranet web application</li>
              <li>Methodology: V-cycle</li>
              <li>Team: +/- 5 people</li>
            </ul>
          </p>
          <p><strong>Achievements:</strong>
            <ul>
              <li>Studies, development and testing: implementation of new features and bug fixes on new screens of the existing NewSesame project on financial contributions (payment incidents)</li>
              <li>100% <em>front-end</em> role with links between steps and calls to the Spring Boot <em>back-end</em> mocked in JSON</li>
              <li><em>Software craftsmanship</em>: code review, <mark>pair-programming</mark>, CI, mocks, ...</li>
              <li>Continuous improvement of development quality (Sonar tracking)</li>
            </ul>
          </p>
          <p><strong>Tech stack:</strong> <mark>Angular</mark>, <mark>Spring Boot</mark>, <mark>Spring MVC</mark>, <mark>Jenkins</mark></p>

