              <li>Team: +/- 10 people</li>
              <li>Scale: 700,000+ freelancers - 350,000+ enterprise clients - 60,000+ client projects / year</li>
            </ul>
          </p>
          <p><strong>Achievements:</strong>
            <ul>
              <li>Major technical migration of the <a href="https://www.youtube.com/watch?v=2ug1T0_ZDyA" target="_blank">freelance quotes</a> domain from JSP/HBS/JS/Vue 2 (legacy) to Vue 3 / Nuxt 3 + creation of a new domain and new APIs.</li>
              <li>Technical migration of the freelance recommendations domain (by clients following end of mission) from JSP/HBS/JS/Vue 2 (legacy) to Vue 3 / Nuxt 3 + creation of a new domain and new APIs.</li>
              <li>Team facilitation with introduction of new rituals: demo, daily sync, JIRA templates, QA tracking document, etc.</li>
