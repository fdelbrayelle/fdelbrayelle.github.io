          <p style="font-style: italic; margin-top: 25px;">Fully remote</p>
          <p style="font-weight: bold;">Transaction Tribe - Project Squad (10 months)</p>
          <p><strong>Context:</strong>
            <ul>
              <li>Functional: Management of project / mission tracking between clients and freelancers</li>
